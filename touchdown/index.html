<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060a" />
    <meta name="description" content="Compare lunar south pole landing sites and dates: Sun and Earth above the horizon, power and communication windows." />
    <title>Touchdown — Lunar south pole mission planner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9d4c8'/%3E%3Ccircle cx='21' cy='13' r='11' fill='%2304060a'/%3E%3C/svg%3E" />
  </head>
  <body data-tab="explorer" data-phase="cruise">
    <canvas id="scene"></canvas>
    <div id="pins" aria-hidden="true"></div>
    <div id="veil" aria-hidden="true"></div>
    <div id="ui"></div>
    <div id="loader" role="status">
      <div class="loader-box">
        <span class="brand-mark" aria-hidden="true"></span>
        <b>Touchdown</b>
        <p id="loader-text">…</p>
        <div class="loader-bar"><i id="loader-fill"></i></div>
      </div>
    </div>
    <div id="toast" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
