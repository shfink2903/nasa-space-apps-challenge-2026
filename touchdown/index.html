<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060a" />
    <meta name="description" content="Starship approche la Lune et se pose sur un site réel. Soleil et Terre issus du jeu de données True Larpers." />
    <title>Touchdown — Atterrissage lunaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9d4c8'/%3E%3Ccircle cx='21' cy='13' r='11' fill='%2304060a'/%3E%3C/svg%3E" />
